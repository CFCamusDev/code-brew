# Registro de accesos del webhook de Culqi: igual que el formato por defecto de Nginx pero con la ruta sin la cadena de
# consulta, porque ahí viaja la clave (?key=...). Así la clave no queda en los logs de la stack (ni en Portainer).
log_format webhook '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                   '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

# Conserva el protocolo original cuando nginx está detrás de Cloudflare (que termina el HTTPS).
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name localhost;
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $app_upstream codebrew-app:4321;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;

    # Compresión Gzip para máxima velocidad en redes móviles
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # Cabeceras de seguridad para todas las respuestas
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Todo se sirve desde la app Astro (Node). Los assets de /_astro/ ya salen con caché inmutable de 1 año.
    location / {
        proxy_pass http://$app_upstream;
    }

    # Webhook de Culqi: la clave va en la URL (?key=...), así que no se registra ni en accesos ni en errores (el
    # registro de errores de Nginx imprime la petición completa; un fallo del upstream igual queda en el de accesos).
    location = /api/webhooks/culqi {
        access_log /var/log/nginx/access.log webhook;
        error_log /dev/null;
        proxy_pass http://$app_upstream;
    }

    # Desactivar logs para favicon y robots si no existen
    location = /favicon.ico {
        proxy_pass http://$app_upstream;
        log_not_found off;
        access_log off;
    }

    location = /robots.txt {
        proxy_pass http://$app_upstream;
        log_not_found off;
        access_log off;
    }
}
