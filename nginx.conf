# Registro de accesos del webhook de Culqi: igual que el formato por defecto de Nginx pero con la ruta sin la cadena de
# consulta, porque ahí viaja la clave (?key=...). Así la clave no queda en los logs de la stack (ni en Portainer).
log_format webhook '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                   '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

# Conserva el protocolo original cuando nginx está detrás de Cloudflare (que termina el HTTPS).
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# ── Límite de peticiones (limit_req) ─────────────────────────────────────────────────────────────
# Con una sola instancia, el límite aquí es lo más simple y sobrevive a reinicios de la app. Superarlo devuelve 429
# sin llegar a Node. Los límites del servidor (login, "¿Dónde está mi pedido?") quedan como segunda barrera.
#
# La clave es la IP real del cliente: Cloudflare la manda en CF-Connecting-IP y, sin Cloudflare, vale la del socket.
# Esa cabecera solo es confiable si el origen únicamente recibe tráfico de Cloudflare (la app ya la usa igual).
map $http_cf_connecting_ip $limit_ip {
    default $http_cf_connecting_ip;
    ''      $remote_addr;
}

# Cada mapa elige a qué rutas aplica su zona: la clave vacía no se cuenta. Se limitan solo las escrituras y los
# endpoints sensibles; el sondeo del estado de un pedido (GET) y las páginas no se tocan.
map "$request_method $uri" $key_login {
    "POST /api/admin/login" $limit_ip;
    default "";
}
map "$request_method $uri" $key_orders {
    "POST /api/orders"                      $limit_ip;
    "~^POST /api/orders/[^/]+/items$"       $limit_ip;
    default "";
}
map "$request_method $uri" $key_lookup {
    "POST /api/orders/lookup" $limit_ip;
    default "";
}
map "$request_method $uri" $key_payments {
    "POST /api/payments/session" $limit_ip;
    "POST /api/payments/charge"  $limit_ip;
    default "";
}
map "$request_method $uri" $key_contact {
    "GET /api/contact/whatsapp" $limit_ip;
    "POST /api/complaints"      $limit_ip;
    default "";
}

# Los topes vienen de variables NGINX_RATE_* (valores por defecto en el Dockerfile): Nginx sustituye solo esas
# variables al arrancar, el resto de `$...` queda intacto. El stack de pruebas los sube para que la suite no choque.
limit_req_zone $key_login    zone=login:5m    rate=${NGINX_RATE_LOGIN};
limit_req_zone $key_orders   zone=orders:5m   rate=${NGINX_RATE_ORDERS};
limit_req_zone $key_lookup   zone=lookup:5m   rate=${NGINX_RATE_LOOKUP};
limit_req_zone $key_payments zone=payments:5m rate=${NGINX_RATE_PAYMENTS};
limit_req_zone $key_contact  zone=contact:5m  rate=${NGINX_RATE_CONTACT};

limit_req_status 429;
limit_req_log_level warn;

server {
    listen 80;
    server_name localhost;
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $app_upstream codebrew-app:4321;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    # Id único de la petición: la app lo usa en todos sus logs y lo devuelve en la respuesta (X-Request-Id).
    proxy_set_header X-Request-Id $request_id;

    # Compresión Gzip para máxima velocidad en redes móviles
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # Cabeceras de seguridad para todas las respuestas
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Un tope por zona y ráfaga corta tolerada (varios pedidos o logins seguidos desde la misma red no se bloquean).
    limit_req zone=login    burst=10 nodelay;
    limit_req zone=orders   burst=20 nodelay;
    limit_req zone=lookup   burst=10 nodelay;
    limit_req zone=payments burst=20 nodelay;
    limit_req zone=contact  burst=20 nodelay;

    # Mismo formato de error que la app, para que el navegador muestre el mensaje.
    error_page 429 @rate_limited;
    location @rate_limited {
        default_type application/json;
        add_header Retry-After 60 always;
        add_header Cache-Control "no-store" always;
        return 429 '{"error":"Demasiados intentos. Espera unos minutos e inténtalo de nuevo."}';
    }

    # Todo se sirve desde la app Astro (Node). Los assets de /_astro/ ya salen con caché inmutable de 1 año.
    location / {
        proxy_pass http://$app_upstream;
    }

    # Webhook de Culqi: la clave va en la URL (?key=...), así que no se registra ni en accesos ni en errores (el
    # registro de errores de Nginx imprime la petición completa; un fallo del upstream igual queda en el de accesos).
    location = /api/webhooks/culqi {
        access_log /var/log/nginx/access.log webhook;
        error_log /dev/null;
        proxy_pass http://$app_upstream;
    }

    # Desactivar logs para favicon y robots si no existen
    location = /favicon.ico {
        proxy_pass http://$app_upstream;
        log_not_found off;
        access_log off;
    }

    location = /robots.txt {
        proxy_pass http://$app_upstream;
        log_not_found off;
        access_log off;
    }
}
