server {
    listen 80;
    server_name localhost;

    # Compresión Gzip para máxima velocidad en redes móviles
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # Cabeceras de seguridad para todas las respuestas
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Todo se sirve desde la app Astro (Node). Los assets de /_astro/ ya salen con caché inmutable de 1 año.
    location / {
        proxy_pass http://codebrew-app:4321;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Desactivar logs para favicon y robots si no existen
    location = /favicon.ico {
        proxy_pass http://codebrew-app:4321;
        log_not_found off;
        access_log off;
    }

    location = /robots.txt {
        proxy_pass http://codebrew-app:4321;
        log_not_found off;
        access_log off;
    }
}
