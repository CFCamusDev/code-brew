name: Backups PostgreSQL
on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop, main]
permissions:
  contents: read
concurrency:
  group: backups-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  restore:
    name: Respaldo cifrado y restauración PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/test-backups.mjs
